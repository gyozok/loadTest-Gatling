# Single-node Kafka broker for local development, running in KRaft mode
# Uses the official Apache Kafka image directly
services:

  kafka:
    image: apache/kafka:3.9.0
    container_name: kafka
    ports:
      - "9092:9092"       # client connections from the host (this app)
      - "9094:9094"       # exposed for any tooling that wants to connect from outside docker-compose's network
    environment:
      # --- KRaft mode ---
      - KAFKA_NODE_ID=1
      - KAFKA_PROCESS_ROLES=broker,controller
      - KAFKA_CONTROLLER_QUORUM_VOTERS=1@kafka:9093

      # --- Listeners ---
      # CONTROLLER: used internally for KRaft consensus.
      # PLAINTEXT: how this app (running in docker-compose) connects.
      # EXTERNAL: how a client running on your host machine, outside
      # docker-compose, would connect (e.g. a local kafka-console-consumer).
      - KAFKA_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_INTER_BROKER_LISTENER_NAME=PLAINTEXT

      # --- Single-node friendly settings ---
      # A production cluster would use 3 (so a topic survives one broker
      # going down); with only one broker here, higher values would just
      # fail to satisfy replication and topics wouldn't create.
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_MIN_ISR=1
      - KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS=0
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s

  # One-shot container that creates the order-events topic once the
  # broker is healthy, so the app never has to rely on Kafka's
  # auto-create-on-first-publish behavior
  kafka-init:
    image: apache/kafka:3.9.0
    container_name: kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: |
      bash -c "
      /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic order-events --partitions 3 --replication-factor 1
      /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --list
      "

  # Web UI for browsing topics, messages, partitions, and
  # consumer group lag - at http://localhost:8081.
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8081:8080"
    environment:
      - KAFKA_CLUSTERS_0_NAME=local
      - KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS=kafka:9092

  # The order producer service (Spring Boot). Built from its own Dockerfile
  # in this directory rather than pulled from a registry, since this is the
  # app under active development.
  order-producer:
    build:
      context: .
      dockerfile: order-producer/Dockerfile
    container_name: order-producer
    ports:
      - "8080:8080"
    environment:
      # Overrides application.yml's spring.kafka.bootstrap-servers.
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:9092
    depends_on:
      kafka:
        condition: service_healthy
      kafka-init:
        # wait until topic is created
        condition: service_completed_successfully

